<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather Solar Card demo</title>
  <style>
    html { background:#101622; }
    body { margin:0; padding:28px 14px 80px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .demo-toolbar { width:min(100%,844px); margin:0 auto 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:#eaf5ff; background:#1a2738; border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px 12px; box-sizing:border-box; }
    .demo-toolbar span { font-size:13px; font-weight:700; letter-spacing:.04em; }
    .demo-toolbar select { min-width:190px; color:#fff; background:#30445d; border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:8px 10px; font:inherit; }
    weather-solar-card { display:block; width:min(100%,440px); margin:auto; }
    @media (orientation:landscape) and (min-width:560px) {
      weather-solar-card { width:min(100%,844px); }
    }
  </style>
  <script>customElements.define("ha-card", class extends HTMLElement { connectedCallback(){ this.style.display="block"; } });</script>
  <script type="module" src="./weather-solar-card.js"></script>
</head>
<body>
  <div class="demo-toolbar"><span>Weather preview</span><select id="condition-picker" aria-label="Weather condition">
    <option value="sunny">Sunny</option><option value="partlycloudy">Partly cloudy</option><option value="cloudy">Cloudy</option>
    <option value="windy">Windy</option><option value="windy-variant">Windy & cloudy</option><option value="fog">Fog</option>
    <option value="rainy">Rain</option><option value="pouring">Heavy rain</option><option value="lightning-rainy">Thunderstorm</option>
    <option value="hail">Hail</option><option value="snowy">Snow</option><option value="snowy-rainy">Sleet</option><option value="clear-night">Clear night</option>
  </select></div>
  <weather-solar-card id="card"></weather-solar-card>
  <script type="module">
    await customElements.whenDefined("weather-solar-card");
    const card = document.querySelector("#card");
    const query = new URLSearchParams(location.search);
    const condition = query.get("condition") || (query.has("night") ? "clear-night" : query.has("sunny") ? "sunny" : "rainy");
    const night = condition === "clear-night";
    const picker = document.querySelector("#condition-picker");
    picker.value = condition;
    picker.addEventListener("change", () => {
      const url = new URL(location.href);
      url.searchParams.delete("night");
      url.searchParams.delete("sunny");
      url.searchParams.set("condition", picker.value);
      location.href = url.href;
    });
    if (query.has("wide")) card.style.width = "min(100%,900px)";
    if (query.has("landscape")) card.style.width = "min(100%,844px)";
    if (query.has("compact")) card.style.width = "min(100%,640px)";
    if (query.has("portrait")) card.style.width = "min(100%,440px)";
    card.setConfig({
      name: "Back Garden",
      weather_entity: "weather.home",
      sun_entity: "sun.sun",
      minute_forecast_entity: "sensor.rain_minutes",
      temperature_entity: "sensor.outdoor_temperature",
      apparent_temperature_entity: "sensor.feels_like",
      uv_index_entity: "sensor.uv",
      rain_rate_entity: "sensor.rain_rate",
      daily_rain_entity: "sensor.rain_today",
      wind_speed_unit: query.has("mph") ? "mph" : "auto",
    });
    const presets = {
      sunny:{temp:24,feels:25,humidity:46,pressure:1021,wind:7,bearing:146,cloud:6,visibility:24,uv:6.4,rain:0,sun:54.8,azimuth:184,pop:0},
      partlycloudy:{temp:21,feels:21,humidity:58,pressure:1018,wind:11,bearing:190,cloud:43,visibility:19,uv:4.8,rain:0,sun:39.2,azimuth:202,pop:8},
      cloudy:{temp:18,feels:17,humidity:72,pressure:1012,wind:14,bearing:215,cloud:97,visibility:13,uv:1.7,rain:0,sun:25.4,azimuth:221,pop:18},
      windy:{temp:17,feels:14,humidity:61,pressure:1005,wind:43,bearing:238,cloud:24,visibility:18,uv:2.9,rain:0,sun:20.1,azimuth:238,pop:12},
      "windy-variant":{temp:16,feels:13,humidity:69,pressure:1003,wind:48,bearing:244,cloud:78,visibility:12,uv:1.4,rain:0,sun:16.5,azimuth:244,pop:24},
      fog:{temp:12,feels:11,humidity:96,pressure:1015,wind:3,bearing:90,cloud:100,visibility:.4,uv:.3,rain:0,sun:9.8,azimuth:132,pop:10},
      rainy:{temp:17,feels:16,humidity:84,pressure:1007,wind:18,bearing:224,cloud:91,visibility:8.4,uv:2.1,rain:1.8,sun:18.4,azimuth:251,pop:82},
      pouring:{temp:15,feels:13,humidity:93,pressure:999,wind:28,bearing:231,cloud:100,visibility:3.2,uv:.4,rain:9.6,sun:12.2,azimuth:249,pop:98},
      "lightning-rainy":{temp:19,feels:20,humidity:88,pressure:995,wind:34,bearing:207,cloud:100,visibility:5.1,uv:.8,rain:5.4,sun:15.1,azimuth:218,pop:96},
      hail:{temp:6,feels:2,humidity:86,pressure:1001,wind:31,bearing:272,cloud:98,visibility:4.6,uv:.7,rain:4.1,sun:10.4,azimuth:263,pop:91},
      snowy:{temp:-2,feels:-7,humidity:90,pressure:1008,wind:19,bearing:18,cloud:96,visibility:2.8,uv:.5,rain:2.2,sun:8.7,azimuth:174,pop:88},
      "snowy-rainy":{temp:1,feels:-3,humidity:92,pressure:1004,wind:23,bearing:32,cloud:99,visibility:3.4,uv:.4,rain:3.1,sun:7.2,azimuth:182,pop:92},
      "clear-night":{temp:11,feels:9,humidity:76,pressure:1020,wind:6,bearing:120,cloud:5,visibility:22,uv:0,rain:0,sun:-22.6,azimuth:251,pop:0}
    };
    const p = presets[condition] || presets.cloudy;
    const wet = ["rainy","pouring","lightning-rainy","hail","snowy","snowy-rainy"].includes(condition);
    const minuteRain = Array.from({length:60},(_,i) => !wet ? 0 : i < 7 ? 0 : i < 16 ? (i-6)*.12*p.rain : i < 31 ? Math.max(.12,(31-i)*.08*p.rain) : 0);
    const transitions = night ? ["clear-night","clear-night","clear-night","partlycloudy","partlycloudy","sunny"] : [condition,condition,condition,condition === "sunny" ? "partlycloudy" : condition,"partlycloudy","clear-night"];
    const forecast = transitions.map((nextCondition,i) => ({datetime:new Date(Date.now()+i*3600000).toISOString(),condition:nextCondition,temperature:Math.round(p.temp+(i<3?i:-i/2)),precipitation_probability:Math.max(0,Math.round(p.pop-i*7))}));
    card.hass = {
      config:{latitude:51.5074,longitude:-0.1278,time_zone:"Europe/London",unit_system:{temperature:"°C",length:"km",wind_speed:"km/h",pressure:"hPa"}},
      states:{
        "weather.home":{state:condition,attributes:{friendly_name:"Back Garden",temperature:p.temp,apparent_temperature:p.feels,humidity:p.humidity,pressure:p.pressure,wind_speed:p.wind,wind_bearing:p.bearing,cloud_coverage:p.cloud,visibility:p.visibility,temperature_unit:"°C",wind_speed_unit:"km/h",pressure_unit:"hPa",visibility_unit:"km",precipitation_unit:"mm"}},
        "sensor.outdoor_temperature":{state:String(p.temp),attributes:{}},
        "sensor.feels_like":{state:String(p.feels),attributes:{}},
        "sensor.uv":{state:String(p.uv),attributes:{}},
        "sensor.rain_rate":{state:String(p.rain),attributes:{}},
        "sensor.rain_today":{state:"3.6",attributes:{}},
        "sensor.rain_minutes":{state:"on",attributes:{forecast:minuteRain}},
        "sensor.moon_phase":{state:"waxing_gibbous",attributes:{}},
        "sensor.moon_illumination":{state:"78",attributes:{}},
        "sun.sun":{state:night?"below_horizon":"above_horizon",attributes:{elevation:p.sun,azimuth:p.azimuth,next_rising:"2026-08-26T06:03:00+01:00",next_setting:"2026-08-25T20:02:00+01:00"}}
      },
      connection:{async subscribeMessage(callback){callback({type:"hourly",forecast});return ()=>{};}},
      async callWS(){return {response:{}}}
    };
  </script>
</body>
</html>
